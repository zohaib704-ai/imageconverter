<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – ImageToolkit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">ImageToolkit</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Contact Us</h1>
    <p style="color:#555; margin-bottom:1.5rem;">Send us a message and we’ll get back to you as soon as possible.</p>

    <!-- Replace YOUR_FORM_ID with your actual Formspree form ID -->
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" style="max-width:600px; margin:auto;">
      <div style="margin-bottom:1rem;">
        <label for="name" style="display:block; font-weight:600; margin-bottom:0.3rem;">Your Name</label>
        <input type="text" id="name" name="name" required style="width:100%; padding:0.75rem; border:1px solid #d1d5db; border-radius:8px;">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="email" style="display:block; font-weight:600; margin-bottom:0.3rem;">Your Email</label>
        <input type="email" id="email" name="email" required style="width:100%; padding:0.75rem; border:1px solid #d1d5db; border-radius:8px;">
      </div>
      <div style="margin-bottom:1rem;">
        <label for="message" style="display:block; font-weight:600; margin-bottom:0.3rem;">Message</label>
        <textarea id="message" name="message" rows="5" required style="width:100%; padding:0.75rem; border:1px solid #d1d5db; border-radius:8px;"></textarea>
      </div>
      <button type="submit" class="primary-btn" style="width:100%;">Send Message</button>
    </form>

    <p style="margin-top:1.5rem; color:#555; text-align:center;">
      You can also email us directly at <strong>hello@yourdomain.com</strong>.
    </p>
  </main>
  <footer><p>© 2026 ImageToolkit. <a href="privacy.html">Privacy Policy</a></p></footer>
</body>
</html>
