<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Toolkit – Convert, Compress, Edit & OCR</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- CDN libraries -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
</head>
<body>
  <header>
    <nav>
      <a href="index.html" class="logo">ImageToolkit</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="tool-hub">
      <h1>Your All‑in‑One Image Toolkit</h1>
      <p>Upload an image to compress, crop, enhance, OCR, add text, or use the camera.</p>

      <!-- Upload / Camera -->
      <div class="upload-area">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <button id="uploadBtn" class="primary-btn">📁 Upload Image</button>
        <button id="cameraBtn" class="secondary-btn">📷 Use Camera</button>
      </div>

      <!-- Hidden video for camera -->
      <video id="cameraPreview" autoplay playsinline hidden></video>
      <button id="captureBtn" hidden>📸 Capture</button>

      <!-- Canvas / Preview -->
      <div class="preview-container">
        <canvas id="canvas" hidden></canvas>
        <img id="imagePreview" hidden>
      </div>

      <!-- Tool Tabs -->
      <div class="tool-tabs" hidden id="toolTabs">
        <button data-tool="compress">📦 Compress</button>
        <button data-tool="crop">✂️ Crop</button>
        <button data-tool="enhance">✨ Enhance</button>
        <button data-tool="ocr">🔍 OCR</button>
        <button data-tool="text">✏️ Add Text</button>
        <button data-tool="lens">🔎 Google Lens</button>
      </div>

      <!-- Dynamic tool panels -->
      <div id="toolPanel"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 ImageToolkit. <a href="privacy.html">Privacy Policy</a></p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/compress.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/enhance.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/text-overlay.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/lens.js"></script>
</body>
</html>
